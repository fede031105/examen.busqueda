<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5 min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4 p-4">
                <div class="card-body">
                    <h2 class="text-center mb-4 fw-bold text-primary">Registro de Usuario</h2>
                    <div id="mensaje" class="alert d-none text-center" role="alert"></div>

                    <form id="formRegistro">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellidoPaterno" class="form-label">Apellido Paterno</label>
                            <input type="text" class="form-control" id="apellidoPaterno" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellidoMaterno" class="form-label">Apellido Materno</label>
                            <input type="text" class="form-control" id="apellidoMaterno" required>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correo" required>
                        </div>
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Nombre de Usuario (min. 5 caracteres)</label>
                            <input type="text" class="form-control" id="usuario" required minlength="5">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña (min. 8 caracteres)</label>
                            <input type="password" class="form-control" id="password" required minlength="8">
                        </div>
                        <div class="mb-4">
                            <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacimiento" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('formRegistro').addEventListener('submit', function(e) {
        e.preventDefault();

        const data = {
            nombre: document.getElementById('nombre').value,
            apellidoPaterno: document.getElementById('apellidoPaterno').value,
            apellidoMaterno: document.getElementById('apellidoMaterno').value,
            correo: document.getElementById('correo').value,
            usuario: document.getElementById('usuario').value,
            password: document.getElementById('password').value,
            fechaNacimiento: document.getElementById('fechaNacimiento').value
        };

        fetch('/api/v1/usuarios', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(async response => {
            const texto = await response.text();
            const divMensaje = document.getElementById('mensaje');
            divMensaje.classList.remove('d-none', 'alert-success', 'alert-danger');

            if(response.ok) {
                divMensaje.classList.add('alert-success');
                divMensaje.innerText = texto;
                document.getElementById('formRegistro').reset();
            } else {
                divMensaje.classList.add('alert-danger');
                divMensaje.innerText = texto;
            }
        })
        .catch(error => console.error('Error:', error));
    });
</script>
</body>
</html>
